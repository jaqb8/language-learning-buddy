name: Deploy to Cloudflare Workers (Preview)

on:
  push:
    branches:
      - staging
    paths-ignore:
      - "docs/**"
      - "**/README.md"

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (Preview)
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Connect to staging tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.118.42.105

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        timeout-minutes: 10
        env:
          PGSSLMODE: disable
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          supabase migration up --db-url "$STAGING_DB_URL" --include-all

      - name: Build application
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_ENCRYPTION_KEY_V1: ${{ secrets.DATA_ENCRYPTION_KEY_V1 }}
          CACHE_HMAC_KEY_V1: ${{ secrets.CACHE_HMAC_KEY_V1 }}
          PUBLIC_ENV_NAME: ${{ vars.ENV_NAME }}
          USE_MOCKS: false
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APP_NAME: ${{ vars.APP_NAME }}
          ASTRO_SITE: ${{ vars.ASTRO_SITE }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=staging
          environment: staging
          secrets: |
            SUPABASE_SECRET_KEY
            DATA_ENCRYPTION_KEY_V1
            CACHE_HMAC_KEY_V1
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_ENCRYPTION_KEY_V1: ${{ secrets.DATA_ENCRYPTION_KEY_V1 }}
          CACHE_HMAC_KEY_V1: ${{ secrets.CACHE_HMAC_KEY_V1 }}
